apiVersion: 1

contactPoints:
  - orgId: 1
    name: email-andre
    receivers:
      - uid: email-andre
        type: email
        settings:
          addresses: ${ALERT_EMAIL}
          singleEmail: true

policies:
  - orgId: 1
    receiver: email-andre
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
